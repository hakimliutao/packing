<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e6b52">
<title>المنتجات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="search-bar"></div>
<div id="site-drawer"></div>
<header id="site-header"></header>

<section class="page-head">
  <div class="wrap">
    <nav class="crumbs"><a href="index.html">الرئيسية</a> <span>/</span> <span id="crumb-here"></span></nav>
    <h1 id="page-title" style="font-size:clamp(26px,3.6vw,40px)"></h1>
    <p id="page-sub" style="color:var(--ink-2);font-size:16.5px;margin-top:10px"></p>
  </div>
</section>

<section style="padding-top:0">
  <div class="wrap">
    <div id="sector-box"></div>

    <div class="toolbar">
      <label class="search-inline">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="q" autocomplete="off" placeholder="">
      </label>
      <select class="chip" id="sort" style="border-radius:12px;padding:11px 14px"></select>
      <span class="count-note" id="count-note"></span>
    </div>

    <div id="filter-slot"></div>
    <div class="grid-4" id="grid"></div>
  </div>
</section>

<section style="padding-top:0">
  <div class="wrap"><div id="cta-slot"></div></div>
</section>

<footer id="site-footer"></footer>

<script src="assets/api.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/popup.js"></script>
<script src="assets/seo.js"></script>
<script src="assets/currency.js"></script>
<script src="assets/pricing.js"></script>
<script src="assets/site.js"></script>
<script>
async function initProducts() {
  await boot('products');
  const { tax, site } = CTX;
  const ui = tax.ui;
  const params = new URLSearchParams(location.search);
  const sort0 = params.get('sort') || 'rel';
  const fav = params.get('fav') === '1';
  const q0 = params.get('q') || '';

  /* 三个分类维度各一个值，同时生效、互相叠加。
     材料是多选的（最多两个），产品/场景是单选 —— 同一维度选两个
     等于「同时属于这两类」，包装品类里几乎不存在这种产品，
     只会给用户一个空页面。各维度单选，另外两个维度自由叠加。 */
  const cur = {
    cat: params.get('cat') || '',
    sec: params.get('sec') || '',
    mat: (params.get('mat') || '').split(',').filter(Boolean),
    /* 工艺（r27）跟材料一样是多选，最多两个 */
    craft: (params.get('craft') || '').split(',').filter(Boolean),
  };

  document.title = `${ui.allProductsAr} — ${site.brand.nameAr}`;
  const qIn = document.getElementById('q');
  qIn.placeholder = ui.searchPlaceholderAr;
  document.getElementById('crumb-here').textContent = ui.allProductsAr;

  /* 排序下拉 */
  const sortSel = document.getElementById('sort');
  sortSel.innerHTML = [
    ['rel', ui.sortRelAr || 'الأكثر ملاءمة'],
    ['new', ui.sortNewAr || 'الأحدث'],
    ['az', ui.sortAzAr || 'أبجدياً']
  ].map(([v, t]) => `<option value="${v}">${esc(t)}</option>`).join('');
  sortSel.value = sort0;

  function syncURL() {
    const p = new URLSearchParams();
    if (cur.cat) p.set('cat', cur.cat);
    if (cur.sec) p.set('sec', cur.sec);
    if (cur.mat.length) p.set('mat', cur.mat.join(','));
    if (cur.craft.length) p.set('craft', cur.craft.join(','));
    if (qIn.value.trim()) p.set('q', qIn.value.trim());
    if (sortSel.value !== 'rel') p.set('sort', sortSel.value);
    if (fav) p.set('fav', '1');
    const q = p.toString();
    history.replaceState(null, '', location.pathname + (q ? '?' + q : ''));
  }

  function titleFor() {
    const ui2 = tax.ui;
    if (cur.mat.length === 1) {
      const m = materialOf(cur.mat[0]);
      if (m) return m.nameAr;
    }
    if (cur.cat) { const c = catOf(cur.cat); if (c) return c.nameAr; }
    if (cur.sec) { const s = sectorOf(cur.sec); if (s) return s.nameAr; }
    return ui2.allProductsAr;
  }

  const all = await getProducts({ includeUnpublished: false });
  const favList0 = fav ? favList() : null;

  const grid = document.getElementById('grid');
  const countNote = document.getElementById('count-note');
  const fs = document.getElementById('filter-slot');

  /* 三个维度叠加过滤。材料多选取交集。 */
  function filtered() {
    let list = all.slice();
    if (cur.cat) list = list.filter(p => p.categoryId === cur.cat);
    if (cur.sec) list = list.filter(p => (p.sectorIds || []).includes(cur.sec));
    if (cur.mat.length === 1) {
      list = list.filter(p => matchMaterial(p, cur.mat[0]));
    } else if (cur.mat.length > 1) {
      list = list.filter(p => cur.mat.every(m => matchMaterial(p, m)));
    }
    /* 工艺（r27）：产品身上存的是 craftIds，直接按 id 取交集。
       跟材料不一样 —— 材料有「阿语名反查」那套（老数据只有文本），
       工艺是新字段，从第一天就是 id，不用反查。 */
    if (cur.craft.length) {
      list = list.filter(p => {
        const ids = p.craftIds || [];
        return cur.craft.every(id => ids.indexOf(id) >= 0);
      });
    }
    if (favList0) { const s0 = new Set(favList0); list = list.filter(p => s0.has(p.id)); }
    const kw = qIn.value.trim();
    if (kw) list = searchProducts(list, kw).list;
    if (sortSel.value === 'az') {
      list.sort((a, b) => (a.nameAr || '').localeCompare(b.nameAr || '', 'ar'));
    }
    return list;
  }

  function renderPanel() {
    fs.innerHTML = filterPanel(cur) + activeFilterTags(cur);
    const t = titleFor();
    document.getElementById('page-title').textContent = t;
    const s = (cur.cat && catOf(cur.cat)) || (cur.sec && sectorOf(cur.sec))
           || (cur.mat.length === 1 && materialOf(cur.mat[0]))
           || (cur.craft.length === 1 && craftById(cur.craft[0])) || null;
    document.getElementById('page-sub').textContent = (s && s.descAr) || ui.sectorSubAr || '';
    bindPanel();
  }

  function bindPanel() {
    fs.querySelectorAll('[data-f]').forEach(el => {
      el.onclick = () => {
        const f = el.dataset.f;
        const v = el.dataset.v;
        if (f === 'clear') { cur.cat = ''; cur.sec = ''; cur.mat = []; cur.craft = []; }
        else if (f === 'mat') {
          /* 再点一次同一个 = 取消；材料最多两个，第三个顶掉最早的 */
          const i = cur.mat.indexOf(v);
          if (v === '' || i >= 0) cur.mat.splice(i, 1);
          else { cur.mat.push(v); if (cur.mat.length > 2) cur.mat.shift(); }
        }
        else if (f === 'craft') {
          /* 工艺跟材料同一套规则：最多两个，第三个顶掉最早的 */
          const i = cur.craft.indexOf(v);
          if (v === '' || i >= 0) cur.craft.splice(i, 1);
          else { cur.craft.push(v); if (cur.craft.length > 2) cur.craft.shift(); }
        }
        else cur[f] = (cur[f] === v) ? '' : v;
        renderPanel(); render(); syncURL();
      };
    });
  }

  function render() {
    const kw = qIn.value.trim();
    const list = filtered();
    const n = list.length;
    countNote.innerHTML = `<b>${n}</b> ${esc(ui.resultsAr)}${kw ? ` — ${esc(kw)}` : ''}`;
    grid.innerHTML = list.map(productCard).join('') ||
      emptyState(kw ? ui.noResultAr : (fav ? ui.emptyFavAr : ui.emptyCategoryAr),
                 fav ? ui.emptyFavSubAr : ui.emptyCategorySubAr);
    paintFavs();
    /* 换筛选条件后计数和标题都要跟着动 */
    const t = titleFor();
    document.getElementById('page-title').textContent = t;
    const s = (cur.cat && catOf(cur.cat)) || (cur.sec && sectorOf(cur.sec))
           || (cur.mat.length === 1 && materialOf(cur.mat[0]))
           || (cur.craft.length === 1 && craftById(cur.craft[0])) || null;
    document.getElementById('page-sub').textContent = (s && s.descAr) || ui.sectorSubAr || '';
  }

  let t = null;
  qIn.addEventListener('input', () => {
    clearTimeout(t); t = setTimeout(() => { render(); syncURL(); }, 160);
  });
  sortSel.addEventListener('change', () => { render(); syncURL(); });

  qIn.value = q0;
  CTX.lastQuery = q0;
  renderPanel();
  render();
  syncURL();
}
initProducts().catch(e => console.error('[products]', e));
</script>
</body>
</html>
