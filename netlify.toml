[build]
  # 不用任何构建命令，这是个纯静态站 + Netlify Functions
  command = ""
  publish = "."
  functions = "netlify/functions"
  # ★ 千万别在这里写 ignore 数组来「排除文件」。
  #   Netlify 的 build.ignore 是「跳过构建的命令」（字符串），不是排除列表。
  #   写成数组会直接挂在：
  #     Configuration property build.ignore must be a string
  #   r24 踩过 —— 想排除备份目录，结果整个部署失败，线上一直是旧版本。
  #
  #   正确做法：把不发布的目录/文件**移到站点目录外面**。
  #   备份/ 和 备份-测试文件/（共 6.8MB）已经移到项目根目录，不在发布范围内了。
  #   以后新增的临时目录，同样移出去，别指望配置能挡。

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # @netlify/blobs 是构建时依赖，不当外部包排除掉
  external_node_modules = []

# ---------- API 路由 ----------
[[redirects]]
  from = "/api/products"
  to = "/.netlify/functions/products"
  status = 200

[[redirects]]
  from = "/api/categories"
  to = "/.netlify/functions/categories"
  status = 200

[[redirects]]
  from = "/api/site"
  to = "/.netlify/functions/site"
  status = 200

[[redirects]]
  from = "/api/seed"
  to = "/.netlify/functions/seed"
  status = 200

[[redirects]]
  from = "/api/img"
  to = "/.netlify/functions/img"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200

# 汇率（海湾六国换算用）。函数内部自己缓存一小时，不用 CDN 缓存。
[[redirects]]
  from = "/api/fx"
  to = "/.netlify/functions/fx"
  status = 200

# 一次性数据迁移，跑完就把这个文件和 migrate.js 一起删掉
[[redirects]]
  from = "/api/migrate"
  to = "/.netlify/functions/migrate"
  status = 200

# ---------- 响应头 ----------
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# data/ 里是初始数据，线上从数据库读，这个目录只用于 seed 初始化
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
